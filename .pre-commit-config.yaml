repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: biome
        name: Biome
        entry: pnpm exec biome check --error-on-warnings
        language: system
        types_or: [javascript, json, ts]
      - id: package-boundaries
        name: package boundaries
        entry: node scripts/check-boundaries.ts
        language: system
        pass_filenames: false
      - id: generated-files
        name: generated files
        entry: node scripts/check-generated.ts
        language: system
        pass_filenames: false
      - id: reuse
        name: REUSE licensing
        entry: reuse lint
        language: system
        pass_filenames: false
