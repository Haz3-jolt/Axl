version = 1

[[annotations]]
path = [
  "LICENSE",
  "NOTICE",
  "biome.json",
  "package.json",
  "packages/*/package.json",
  "packages/*/tsconfig*.json",
  "packages/extensions/*/package.json",
  "packages/extensions/*/tsconfig*.json",
  "pnpm-lock.yaml",
  "tsconfig*.json",
]
SPDX-FileCopyrightText = "2026 Hari Srinivasan"
SPDX-License-Identifier = "Apache-2.0"

# Build output is disposable and inherits its source license.
[[annotations]]
path = ["packages/*/dist/**", "packages/extensions/*/dist/**"]
SPDX-FileCopyrightText = "2026 Hari Srinivasan"
SPDX-License-Identifier = "Apache-2.0"

# pnpm creates this ignored executable link from yaml's ISC-licensed package.
[[annotations]]
path = "packages/extensions/skills/node_modules/.bin/yaml"
SPDX-FileCopyrightText = "2018 Eemeli Aro"
SPDX-License-Identifier = "ISC"

# Screenshots are rendered terminal captures of Kepler itself.
[[annotations]]
path = "docs/screenshots/**"
SPDX-FileCopyrightText = "2026 Hari Srinivasan"
SPDX-License-Identifier = "Apache-2.0"
